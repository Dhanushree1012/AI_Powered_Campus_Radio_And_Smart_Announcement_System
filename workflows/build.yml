name: Flutter Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch: # Allows triggering the build manually from the GitHub UI

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout codebase
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java Environment
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter Environment
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Resolve Dart Dependencies
      - name: Install Project Dependencies
        run: |
          cd admin_app
          flutter pub get

      # 5. Compile release APK
      - name: Build Android Release APK
        run: |
          cd admin_app
          flutter build apk --release --android-skip-build-dependency-validation || true
          
          # Inspect generated build directory and locate release APK
          echo "=== Locating Built APK Files ==="
          find . -name "*.apk"
          
          mkdir -p build/app/outputs/flutter-apk
          APK_FILE=$(find . -name "*release*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at $APK_FILE, copying to build/app/outputs/flutter-apk/app-release.apk"
            cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
          else
            echo "No APK found from flutter build, attempting direct Gradle assembleRelease..."
            cd android
            ./gradlew assembleRelease
            cd ..
            APK_FILE=$(find . -name "*release*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              echo "Found Gradle APK at $APK_FILE"
              cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
            else
              echo "ERROR: Failed to generate release APK"
              exit 1
            fi
          fi

      # 6. Upload compiled APK to GitHub Artifacts storage
      - name: Upload APK Release Build
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
